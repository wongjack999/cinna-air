<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bfdef5">
<title>Cinna Air · 機場報到</title>
<link rel="stylesheet" href="check-in.css">
<script defer src="check-in.js"></script>
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="plane" viewBox="0 0 24 24"><path fill="currentColor" d="M22 12a1.2 1.2 0 0 0-1.2-1.2h-6l-4.4-7H8.2l2.2 7H5.9L4 8.6H2.3L3.6 12l-1.3 3.4H4l2-2.2h4.4l-2.2 7h2.2l4.4-7h6A1.2 1.2 0 0 0 22 12Z"/></symbol>
  <symbol id="journey" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H16a3 3 0 0 1 0 6H8a3 3 0 0 0 0 6h7.5"/></g></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h13m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4.2 4.2L19 6.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ticket" viewBox="0 0 24 24"><path d="M3 6h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4V6Zm11 2v1m0 2.5v1m0 2.5v1" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="passport" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"><rect x="5.5" y="3.5" width="13" height="17" rx="2"/><circle cx="12" cy="10.5" r="3.2"/><path d="M9 10.5h6m-4.4 5.8h2.8"/></g></symbol>
  <symbol id="bag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"><path d="M5.5 8h13l1 12h-15z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></g></symbol>
  <symbol id="close" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
</svg>
<main class="game" data-state="before" aria-labelledby="chapter-title">
  <header class="topbar">
    <div class="brand"><span><svg aria-hidden="true"><use href="#plane"/></svg></span>Cinna Air</div>
    <button class="journey-button glass" type="button" data-open-journey aria-haspopup="dialog"><svg aria-hidden="true"><use href="#journey"/></svg>旅程</button>
  </header>

  <section class="itinerary glass" aria-label="航程與旅程進度">
    <div class="itinerary-heading">
      <h1 id="chapter-title">機場報到</h1>
      <span class="chapter-count">第 2 站 <span>·</span> <span class="progress-text" data-progress-text>1 / 5 完成</span></span>
    </div>
    <div class="progress" role="progressbar" aria-label="旅程已完成關卡" aria-valuemin="0" aria-valuemax="5" aria-valuenow="1">
      <i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="route" role="group" data-route-summary>
      <div class="airport"><strong data-route="from"></strong><span data-route="fromCity"></span></div>
      <div class="flight-line" aria-hidden="true"><span><svg><use href="#plane"/></svg></span></div>
      <div class="airport"><strong data-route="to"></strong><span data-route="toCity"></span></div>
    </div>
  </section>

  <section class="stage" data-stage aria-label="第一身機場櫃檯">
    <div class="drop" data-drop aria-hidden="true"><span>放低護照</span></div>
    <button class="passport" data-passport type="button" aria-label="遞交護照">
      <img src="assets/passport.webp" alt="" draggable="false">
    </button>
    <span class="stage-success" aria-hidden="true"><svg><use href="#check"/></svg></span>
  </section>

  <section class="dock glass" aria-label="報到操作">
    <div class="mission" role="status" aria-live="polite" aria-atomic="true">
      <span class="mission-icon" aria-hidden="true"><svg class="pending"><use href="#passport"/></svg><svg class="complete"><use href="#check"/></svg></span>
      <div><h2 data-status>出示護照</h2><p data-hint>點擊護照，或拖到櫃檯。</p></div>
    </div>
    <div class="reward">
      <svg aria-hidden="true"><use href="#bag"/></svg>
      <span>基本購物金 <small>完成旅程後領取</small></span>
      <strong data-reward></strong>
    </div>
    <button class="cta" type="button" data-action>
      <span data-action-label>遞交護照</span><svg aria-hidden="true"><use href="#arrow"/></svg>
    </button>
  </section>

  <dialog class="sheet glass" data-journey aria-labelledby="journey-title">
    <div class="sheet-heading"><h2 id="journey-title">旅程進度</h2><button class="close glass" type="button" data-close aria-label="關閉旅程"><svg aria-hidden="true"><use href="#close"/></svg></button></div>
    <ol class="journey-list">
      <li class="done"><span>01</span><strong>旅行邀請</strong><small>已完成</small></li>
      <li class="current" data-check-in-step aria-current="step"><span>02</span><strong>機場報到</strong><small data-check-in-status>進行中</small></li>
      <li><span>03</span><strong>登機與飛行</strong><small data-next-status>待解鎖</small></li>
      <li><span>04</span><strong>抵達首爾</strong></li>
      <li><span>05</span><strong>領取行李及獎勵</strong></li>
    </ol>
    <button class="reset" type="button" data-reset hidden>重新體驗報到</button>
  </dialog>

  <dialog class="sheet glass" id="boarding-dialog" data-boarding aria-labelledby="boarding-title">
    <div class="sheet-heading">
      <div><p class="issued-label"><svg aria-hidden="true"><use href="#check"/></svg>報到完成</p><h2 id="boarding-title">登機證</h2></div>
      <button class="close glass" type="button" data-close aria-label="關閉登機證"><svg aria-hidden="true"><use href="#close"/></svg></button>
    </div>
    <article class="pass" aria-label="Natalie 嘅登機證">
      <div class="pass-brand">Cinna Air <svg aria-hidden="true"><use href="#plane"/></svg></div>
      <div class="route" role="group" data-route-summary>
        <div class="airport"><strong data-route="from"></strong><span data-route="fromCity"></span></div>
        <div class="flight-line" aria-hidden="true"><span><svg><use href="#plane"/></svg></span></div>
        <div class="airport"><strong data-route="to"></strong><span data-route="toCity"></span></div>
      </div>
      <dl class="pass-details">
        <div><dt>旅客</dt><dd>Natalie</dd></div><div><dt>登機閘口</dt><dd>A07</dd></div><div><dt>座位</dt><dd>2A</dd></div><div><dt>艙等</dt><dd>公主艙</dd></div>
      </dl>
      <div class="stub" aria-hidden="true"><i></i></div>
    </article>
    <button class="cta" type="button" data-close>完成<svg aria-hidden="true"><use href="#check"/></svg></button>
  </dialog>
</main>
</body>
</html>
